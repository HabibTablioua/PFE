spring:
  application:
    name: PackingISOService
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
  main:
    allow-bean-definition-overriding: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
