server:
  port: 8088

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: packing-iso-service
          uri: lb://packing-iso-service
          predicates:
            - Path=/api/packing/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: depacking-iso-service
          uri: lb://depacking-iso-service
          predicates:
            - Path=/api/depacking/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: TransactionHistoryService
          uri: lb://TransactionHistoryService
          predicates:
            - Path=/api/history/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: monitoring-iso-service
          uri: lb://monitoring-iso-service
          predicates:
            - Path=/api/logs/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: auth-service2
          uri: lb://auth-service2
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: auth-service-users
          uri: lb://auth-service2
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200/"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: super-ultra-mega-long-secret-key-123456
  expiration: 86400000  # 24 hours in milliseconds
