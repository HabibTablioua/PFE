spring.application.name=notification-service

# ================================================
# APPLICATION
# ================================================
server.port=8087

# ================================================
# ========== Eureka ==========
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ================================================
# DATABASE (MySQL Exemple)
# ================================================
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# JPA CONFIG
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ================================================
# FLYWAY MIGRATIONS (TEMPORAIREMENT DÉSACTIVÉ)
# ================================================
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
# spring.flyway.repair-on-migrate=true

# ================================================
# LOGGING (Optionnel)
# ================================================
logging.level.org.springframework=INFO
logging.level.org.example.notificationservice=DEBUG


spring.cloud.discovery.enabled=true

jwt.secret=super-ultra-mega-long-secret-key-123456







