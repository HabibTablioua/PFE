<h2 mat-dialog-title>Confirmer la suppression</h2>
<mat-dialog-content>
  <p>Voulez-vous vraiment supprimer cet incident ?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Non</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">Oui</button>
</mat-dialog-actions>
