<mat-toolbar class="topbar gap-10">

  <!-- Mobile Menu -->
  
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-lg-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Notifications">
    <i-tabler class="d-flex" name="bell" [matBadge]="unreadCount > 0 ? unreadCount : null" matBadgeColor="primary"></i-tabler>
  </button>
  <mat-menu #menu="matMenu" class="notification-dropdown cardWithShadow">
    <!-- Header amélioré -->
    <div class="notification-header">
      <div class="header-content">
        <h6 class="header-title">Notifications</h6>
        <div class="header-badge" *ngIf="unreadCount > 0">
          <span class="badge-count">{{ unreadCount }}</span>
        </div>
      </div>
      <div class="notification-actions">
        <button mat-flat-button color="primary" (click)="markAllAsRead()" [disabled]="unreadCount === 0" class="action-btn">
          <i-tabler name="circle-check" class="action-icon"></i-tabler>
          Tout lu
        </button>
        <button mat-flat-button color="warn" (click)="deleteAllNotifications()" class="action-btn">
          <i-tabler name="trash" class="action-icon"></i-tabler>
          Supprimer tout
        </button>
      </div>
    </div>

    <mat-divider class="notification-divider"></mat-divider>

    <!-- Contenu des notifications -->
    <div class="notification-content">
      <div *ngIf="notifications.length === 0; else showNotifications" class="empty-state">
        <div class="empty-icon">
          <i-tabler name="bell-off" class="icon-24"></i-tabler>
        </div>
        <span class="empty-text">Aucune nouvelle notification</span>
      </div>

      <ng-template #showNotifications>
        <div class="notification-list" [@listAnimation]="notifications.length">
          <div *ngFor="let notif of notifications; trackBy: trackByNotification"
            class="notification-item"
            [class.unread]="!notif.read"
            [class.success]="notif.type === 'success'"
            [class.error]="notif.type === 'error'"
            [class.info]="notif.type === 'info'"
            (click)="markNotificationAsRead(notif.id)">

            <div class="notification-icon">
              <i-tabler
                [name]="notif.type === 'success' ? 'circle-check' : (notif.type === 'error' ? 'alert-circle' : 'info-circle')"
                class="icon-20"
              ></i-tabler>
              <div class="status-indicator" *ngIf="!notif.read"></div>
            </div>

            <div class="notification-body">
              <div class="notification-message">{{ notif.message }}</div>
              <div class="notification-time">{{ notif.dateTime | date:'HH:mm:ss' }}</div>
            </div>

            <div class="notification-actions-item">
              <button mat-icon-button (click)="deleteNotification(notif.id, $event)" class="delete-btn">
                <i-tabler name="trash" class="icon-16"></i-tabler>
              </button>
            </div>
          </div>
        </div>
      </ng-template>
    </div>
  </mat-menu>


  <span class="flex-1-auto"></span>

  <!-- --------------------------------------------------------------- -->
  <!-- profile Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <button mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="Notifications">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
  </button>
  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd">
    <div class="profile-menu-header">
      <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="48" />
      <div class="profile-menu-name">{{ (authService.getCurrentUserValue()?.firstname || '') + ' ' + (authService.getCurrentUserValue()?.lastname || '') }}</div>
    </div>
    <button mat-menu-item [routerLink]="['/profile']">
      <mat-icon class="d-flex align-items-center"><i-tabler name="user" class="icon-18 d-flex"></i-tabler></mat-icon>My Profile
    </button>
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center"><i-tabler name="mail" class="icon-18 d-flex"></i-tabler></mat-icon>My
      Account
    </button>
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center"><i-tabler name="list-check"
          class="icon-18 d-flex"></i-tabler></mat-icon>My Task
    </button>

    <div class="p-x-12 m-t-12">
      <button (click)="logout()" mat-stroked-button class="w-100">Logout</button>
    </div>
  </mat-menu>
</mat-toolbar>
