<mat-toolbar class="topbar gap-10">

  <!-- Mobile Menu -->
  
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-lg-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Notifications">
    <i-tabler class="d-flex" name="bell" [matBadge]="unreadCount > 0 ? unreadCount : null" matBadgeColor="primary"></i-tabler>
  </button>
  <mat-menu #menu="matMenu" class="notification-dropdown cardWithShadow">
    <div class="d-flex align-items-center p-x-12">
      <h6 class="f-s-16 f-w-600 m-b-0">Notifications</h6>
      <span class="flex-1-auto"></span>
      <div class="notification-actions">
        <button mat-flat-button color="primary" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
          <i-tabler name="circle-check" class="action-icon"></i-tabler>
          Tout lu
        </button>
        <button mat-flat-button color="warn" (click)="deleteAllNotifications()">
          <i-tabler name="trash" class="action-icon"></i-tabler>
          Supprimer tout
        </button>
      </div>
    </div>

    <mat-divider class="m-t-12"></mat-divider>

    <div *ngIf="notifications.length === 0; else showNotifications" class="p-y-24 p-x-12 text-center">
      <span class="f-s-14 f-w-500 text-muted">Aucune nouvelle notification</span>
    </div>

    <ng-template #showNotifications>
      <button *ngFor="let notif of notifications"
        mat-menu-item
        class="notification-item"
        [class.unread]="!notif.read">

        <div class="d-flex align-items-center w-100 justify-content-between">
          <div class="d-flex align-items-center">
            <i-tabler
              [name]="notif.type === 'success' ? 'circle-check' : (notif.type === 'error' ? 'alert-circle' : 'info-circle')"
              [ngClass]="{
                'text-primary': notif.type === 'info' || notif.type === 'success',
                'text-error': notif.type === 'error'
              }"
            ></i-tabler>
            <span class="f-s-14 m-l-12">{{ notif.message }}</span>
          </div>
          <div class="d-flex align-items-center">
            <span class="f-s-12 text-muted m-l-12 flex-shrink-0">{{ notif.dateTime | date:'HH:mm:ss' }}</span>
            <button mat-icon-button (click)="deleteNotification(notif.id, $event)" class="delete-btn m-l-2">
              <i-tabler name="trash" class="icon-14"></i-tabler>
            </button>
          </div>
        </div>

      </button>
    </ng-template>

  </mat-menu>


  <span class="flex-1-auto"></span>

  <!-- --------------------------------------------------------------- -->
  <!-- profile Dropdown -->
  <!-- --------------------------------------------------------------- -->
  <button mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="Notifications">
    <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
  </button>
  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd">
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center"><i-tabler name="user" class="icon-18 d-flex"></i-tabler></mat-icon>My
      Profile
    </button>
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center"><i-tabler name="mail" class="icon-18 d-flex"></i-tabler></mat-icon>My
      Account
    </button>
    <button mat-menu-item>
      <mat-icon class="d-flex align-items-center"><i-tabler name="list-check"
          class="icon-18 d-flex"></i-tabler></mat-icon>My Task
    </button>

    <div class="p-x-12 m-t-12">
      <a [routerLink]="['/authentication/login']" mat-stroked-button class="w-100">Logout</a>
    </div>
  </mat-menu>
</mat-toolbar>
